name: macOS desktop

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cocoa:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Install native dependencies
        run: brew install sdl3 harfbuzz
      - name: Cocoa window, Metal presentation, Unicode and fonts
        run: dotnet test tests/BubuUI.Platform.MacOS.Tests --logger "trx;LogFileName=macos.trx"
      - name: Verify dependency relocation and signing
        run: python3 eng/test_macos_bundle.py
      - name: Package and run Gallery
        shell: bash
        run: |
          if [ "$(uname -m)" = arm64 ]; then rid=osx-arm64; else rid=osx-x64; fi
          eng/package-macos.sh --rid "$rid" --output out/macos/Gallery.app
          eng/verify-macos-package.sh out/macos/Gallery.app "$rid" > out/macos/verification.log
          out/macos/Gallery.app/Contents/MacOS/Gallery.Desktop --cpu --shot out/gallery-macos.png
          ditto -c -k --sequesterRsrc --keepParent out/macos/Gallery.app out/macos/Gallery.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-validation
          path: |
            tests/BubuUI.Platform.MacOS.Tests/TestResults/*.trx
            out/gallery-macos.png
            out/macos/Gallery.zip
            out/macos/verification.log
            out/macos/Gallery.app/Contents/Resources/native-dependencies.json
