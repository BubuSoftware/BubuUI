name: Package IDE plugins

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip tests (package integrity checks still run)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ide-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: VS Code, Visual Studio and Rider
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check build prerequisites
        run: ./publish.ps1 -CheckOnly

      - name: Read plugin version
        id: version
        run: |
          $version = (Get-Content ide/vscode/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test and package all three plugins
        env:
          SKIP_TESTS: ${{ inputs.skip_tests }}
        run: ./publish.ps1 -SkipTests:($env:SKIP_TESTS -eq 'true')

      - name: Upload VS Code installer
        uses: actions/upload-artifact@v4
        with:
          name: BubuUI-VSCode-${{ steps.version.outputs.value }}
          path: out/ide-release/${{ steps.version.outputs.value }}/BubuUI-VSCode-*.vsix
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Visual Studio installer
        uses: actions/upload-artifact@v4
        with:
          name: BubuUI-VisualStudio-${{ steps.version.outputs.value }}
          path: out/ide-release/${{ steps.version.outputs.value }}/BubuUI-VisualStudio-*.vsix
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Rider installer
        uses: actions/upload-artifact@v4
        with:
          name: BubuUI-Rider-${{ steps.version.outputs.value }}
          path: out/ide-release/${{ steps.version.outputs.value }}/BubuUI-Rider-*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: BubuUI-SHA256SUMS-${{ steps.version.outputs.value }}
          path: out/ide-release/${{ steps.version.outputs.value }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish IDE plugin release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ide-v${{ steps.version.outputs.value }}
          name: BubuUI IDE ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          make_latest: 'false'
          generate_release_notes: true
          body: |
            BubuUI IDE plugins for VS Code, Visual Studio and Rider.
            Download the installer for your IDE and use SHA256SUMS.txt to verify it.
            Framework NuGet packages are published separately under v-prefixed releases.
          files: |
            out/ide-release/${{ steps.version.outputs.value }}/BubuUI-VSCode-${{ steps.version.outputs.value }}.vsix
            out/ide-release/${{ steps.version.outputs.value }}/BubuUI-VisualStudio-${{ steps.version.outputs.value }}.vsix
            out/ide-release/${{ steps.version.outputs.value }}/BubuUI-Rider-${{ steps.version.outputs.value }}.zip
            out/ide-release/${{ steps.version.outputs.value }}/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BubuUI-IDE-diagnostics-${{ github.run_attempt }}
          path: |
            tests/**/TestResults/**
            ide/rider/build/test-results/**
            ide/rider/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
